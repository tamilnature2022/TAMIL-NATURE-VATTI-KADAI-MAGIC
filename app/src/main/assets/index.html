function renderBenefit(n){
 const d=book[n];
 if(!d) return '<div class="benefit">இந்த எண்ணுக்கான பதிவு இல்லை.</div>';
 let parts=[];
 if(d.english) parts.push('<b>அசல் தலைப்பு:</b>\n'+escapeHtml(d.english));
 if(d.fullEnglish) parts.push('<b>பலன்:</b>\n'+escapeHtml(d.fullEnglish));
 if(d.tamil) parts.push('<b>தமிழ் பலன்:</b>\n'+escapeHtml(d.tamil));
 if(d.status==="user_note") parts.push('<b>குறிப்பு:</b>\n'+escapeHtml(d.source));
 if(parts.length===0) parts.push('இந்த எண்ணுக்கான பலன் உரை இன்னும் பதிவு / சரிபார்ப்பு செய்யப்படவில்லை.');
 if(d.status==="provisional" && !d.fullEnglish) parts.push('இது தற்காலிக தலைப்பு மட்டுமே; முழு பலன் உரை சரிபார்க்கப்படவில்லை.');
 return `<div class="benefit">${parts.join('\n\n')}</div>`;
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function analyze(){
 const raw=document.getElementById("mobile").value.replace(/\D/g,"");
 const m=raw.length>10?raw.slice(-10):raw;
 const err=document.getElementById("error"),out=document.getElementById("output");
 if(m.length!==10){err.textContent="சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடவும்.";out.hidden=true;return;}
 err.textContent="";
 const pairs=Array.from({length:5},(_,i)=>m.slice(i*2,i*2+2));
 const total=[...m].reduce((sum,d)=>sum+Number(d),0);
 const values=[...pairs,String(total)];
 document.getElementById("results").innerHTML=values.map((v,i)=>{
   const n=Number(v),d=book[n];
   const status=d?.status==="transcribed"?"புத்தக உரை தட்டச்சு":d?.status==="provisional"?"தற்காலிக தலைப்பு":d?.status==="user_note"?"பயனர் குறிப்பு":"உரை சரிபார்க்கப்பட வேண்டும்";
   return `<article class="result"><div class="resulthead"><span class="resultname">${labels[i][0]}</span><span class="number">${v}</span><span class="status">${status}</span></div>${renderBenefit(n)}</article>`;
 }).join("");
 out.hidden=false;
 out.scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("analyze").addEventListener("click",analyze);
document.getElementById("mobile").addEventListener("keydown",e=>{if(e.key==="Enter")analyze();});
</script></body></html>
