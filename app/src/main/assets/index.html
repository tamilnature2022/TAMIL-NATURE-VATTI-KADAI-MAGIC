<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>Tamil Nature Vattikadai Magic</title>
<style>
:root{--navy:#102a43;--teal:#087e8b;--bg:#f3f6f8;--ink:#172b4d;--muted:#62748a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Tamil",sans-serif}
header{background:linear-gradient(135deg,#102a43,#087e8b);color:white;padding:28px 18px 24px;border-radius:0 0 26px 26px}
.wrap{max-width:760px;margin:auto;padding:0 16px}
.eyebrow{font-size:12px;letter-spacing:1.5px;opacity:.85}
h1{font-size:25px;line-height:1.25;margin:9px 0}
header p{margin:0;color:#e1edf2;font-size:15px}
main{padding:18px 0 32px}
.panel{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #17324d0d}
label{display:block;font-weight:700;font-size:19px;margin-bottom:12px}
.entry{display:flex;gap:10px}
input{width:100%;min-width:0;padding:15px;border:1.5px solid #cbd5df;border-radius:14px;font-size:21px;outline-color:var(--teal)}
button{border:0;border-radius:14px;padding:14px 18px;background:var(--teal);color:white;font-size:18px;font-weight:750;white-space:nowrap}
.hint,.error{font-size:14px;line-height:1.6;color:var(--muted);margin:12px 0 0}
.error{color:#b42318}
#results{display:none}
h2{font-size:21px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{background:#f8fbfc;border:1px solid #dfe8ee;border-radius:16px;padding:15px}
.card .name{font-size:14px;color:var(--muted);line-height:1.45;font-weight:650}
.card .number{font-size:34px;font-weight:850;color:var(--navy);margin-top:5px}
.total{background:#e8f5f5;border-color:#b9dfe0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 25px}
@media(max-width:420px){.entry{gap:7px}button{padding:12px 13px;font-size:16px}.grid{gap:8px}.card{padding:12px}.card .number{font-size:30px}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="eyebrow">TAMIL NATURE • VERSION 14</div>
<h1>TAMIL NATURE<br>VATTIKADAI MAGIC</h1>
<p>ராஜநிலை எண் கணக்கீடு / Mobile Number Calculation</p>
</div></header>
<main class="wrap">
<section class="panel">
<label for="mobile">மொபைல் எண் / Mobile Number</label>
<div class="entry">
<input id="mobile" type="tel" inputmode="numeric" maxlength="16" placeholder="9087417333" autocomplete="off">
<button id="calculate" type="button">கணக்கிடு</button>
</div>
<p class="hint">+91 உள்ளிட்டாலும் பரவாயில்லை. கடைசி 10 இலக்கங்கள் மட்டும் கணக்கிடப்படும்.</p>
<div id="error" class="error" role="alert"></div>
</section>
<section class="panel" id="results" aria-live="polite">
<h2>கணக்கீட்டு முடிவுகள்</h2>
<div class="grid" id="cards"></div>
</section>
</main>
<footer class="wrap">TamilNatureShanmugam</footer>
<script>
const labels = [
 ["ஜாதகர்","முதல் இரண்டு இலக்கங்கள்"],
 ["கணவன் / மனைவி / நண்பர்கள் / கூட்டாளிகள்","இரண்டாவது இரண்டு இலக்கங்கள்"],
 ["தொழில் / வேலை","மூன்றாவது இரண்டு இலக்கங்கள்"],
 ["சொத்து","நான்காவது இரண்டு இலக்கங்கள்"],
 ["குழந்தை","ஐந்தாவது இரண்டு இலக்கங்கள்"],
 ["குடும்பம்","மொத்தம் 10 இலக்கங்களின் கூட்டுத்தொகை"]
];
function calculate(){
 const raw=document.getElementById("mobile").value.replace(/\D/g,"");
 const mobile=raw.length>10?raw.slice(-10):raw;
 const error=document.getElementById("error");
 const results=document.getElementById("results");
 if(mobile.length!==10){
   error.textContent="சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடவும்.";
   results.style.display="none";
   return;
 }
 error.textContent="";
 const pairs=[];
 for(let i=0;i<10;i+=2) pairs.push(mobile.slice(i,i+2));
 const total=[...mobile].reduce((sum,digit)=>sum+Number(digit),0);
 const values=[...pairs,String(total)];
 document.getElementById("cards").innerHTML=values.map((value,i)=>
   `<div class="card ${i===5?'total':''}"><div class="name">${labels[i][0]}<br>${labels[i][1]}</div><div class="number">${value}</div></div>`
 ).join("");
 results.style.display="block";
 results.scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("calculate").addEventListener("click",calculate);
document.getElementById("mobile").addEventListener("keydown",e=>{if(e.key==="Enter")calculate();});
</script>
</body>
</html>
