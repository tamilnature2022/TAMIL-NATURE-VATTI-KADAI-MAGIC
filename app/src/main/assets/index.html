book[69]={status:"transcribed",english:"WILL SUFFER AS IN FIRE",tamil:"",fullEnglish:"IT WILL SEEM AS IF THERE IS DEVELOPMENT IN EVERYTHING, BUT AT THE END EVERYONE WILL CHEAT YOU. WILL HAVE TO INCUR UNWANTED EXPENSES. WILL BE BENEFITED BY COURT AND PANCHAYAT CASES. BUT WHATEVER EFFORTS ARE PUT, IT WILL BE LIKE PUTTING THEM IN FIRE.",tamilBenefit:'எல்லாவற்றிலும் முன்னேற்றம் ஏற்படுவது போலத் தோன்றும். ஆனால் இறுதியில் மற்றவர்கள் ஏமாற்றக்கூடும். தேவையற்ற செலவுகள் ஏற்படலாம். நீதிமன்றம் மற்றும் பஞ்சாயத்து வழக்குகள் மூலம் நன்மை கிடைக்கலாம். எவ்வளவு முயற்சி செய்தாலும் அதன் பலன் வீணாகும் நிலை ஏற்படலாம்.',source:"புத்தகப் படத்திலிருந்து தட்டச்சு செய்யப்பட்ட English உரை; விளிம்பு/படத் தெளிவால் சிறிய OCR/வாசிப்பு பிழைகள் இருக்கலாம்."};
book[70]={status:"transcribed",english:"WILL BE HELPFUL TO OTHERS",tamil:"",fullEnglish:"WILL BE TRUTHFUL TO EVERYONE. WILL GAIN POPULARITY. WHENEVER MONEY IS REQUIRED, WILL ACQUIRE LOAN. WILL PUT GUARANTOR SIGNATURE FOR OTHERS AND HELP EVERYONE. WILL BE BURDENED BY LOANS.",tamilBenefit:'அனைவரிடமும் உண்மையாக இருப்பார். நல்ல பெயரும் மக்கள் ஆதரவும் கிடைக்கும். பணத் தேவை ஏற்படும் போது கடன் பெறுவார். பிறருக்காக ஜாமீன் கையெழுத்திட்டு உதவுவார். ஆனால் கடன் சுமை அதிகரிக்க வாய்ப்புள்ளது.',source:"புத்தகப் படத்திலிருந்து தட்டச்சு செய்யப்பட்ட English உரை; விளிம்பு/படத் தெளிவால் சிறிய OCR/வாசிப்பு பிழைகள் இருக்கலாம்."};

function renderBenefit(n){

}
